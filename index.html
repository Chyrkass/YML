<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YAML Парсер для дипломной работы</title>
    <style>
        .editor-container {
            display: flex;
            gap: 20px;
            margin: 20px;
        }
        .editor, .preview {
            flex: 1;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        textarea {
            width: 100%;
            height: 400px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .preview {
            background-color: #f9f9f9;
        }
        button {
            padding: 10px 20px;
            background-color: #007cba;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <div class="editor">
            <h3>YAML редактор</h3>
            <textarea id="yamlInput">
thesis:
  title: "Моя дипломная работа"
  student:
    name: "Ваше Имя"
    group: "Ваша группа"
  dates:
    defense: "2024-06-10"
    submission: "2024-05-15"
            </textarea>
            <button onclick="parseYAML()">Парсить YAML</button>
        </div>
        
        <div class="preview">
            <h3>Результат</h3>
            <div id="yamlOutput"></div>
        </div>
    </div>

    <script>
        function parseYAML() {
            const yamlText = document.getElementById('yamlInput').value;
            try {
                // Простой парсинг (в реальном проекте используйте js-yaml библиотеку)
                const lines = yamlText.split('\n');
                let html = '<div class="yaml-result">';
                
                lines.forEach(line => {
                    if (line.includes(':')) {
                        const [key, value] = line.split(':');
                        if (value && value.trim()) {
                            html += `<div class="yaml-pair"><strong>${key}:</strong> ${value}</div>`;
                        } else {
                            html += `<div class="yaml-key"><strong>${key}:</strong></div>`;
                        }
                    } else if (line.trim().startsWith('-')) {
                        html += `<div class="yaml-list">${line}</div>`;
                    } else {
                        html += `<div>${line}</div>`;
                    }
                });
                
                html += '</div>';
                document.getElementById('yamlOutput').innerHTML = html;
            } catch (error) {
                document.getElementById('yamlOutput').innerHTML = 
                    `<div style="color: red;">Ошибка парсинга: ${error.message}</div>`;
            }
        }
        
        // Запускаем парсинг при загрузке
        parseYAML();
    </script>
</body>
</html>
